---
# Ansible role requirements for dotfiles repository
roles:
  - name: ansible-role-dotmodules
    src: git+https://github.com/getfatday/ansible-role-dotmodules.git
    # Pinned on purpose: every machine installs the same role revision.
    # To bump: pick the new sha from github.com/getfatday/ansible-role-dotmodules,
    # set it here, then `ansible-galaxy install -r requirements.yml --force`.
    # 28cdf7a: github_releases install kind (role PR #3), needed by the key in modules/tart.
    version: 28cdf7a7d58ccd1b9b985d09a5d4387f120bc412

collections:
  - name: geerlingguy.mac
    version: ">=1.0.0"
