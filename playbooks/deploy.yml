---
# Main deployment playbook for dotfiles
- name: Deploy dotfiles using ansible-role-dotmodules
  hosts: localhost
  vars_files:
    - profiles.yml
  vars:
    # Configure MAS path for x86_64 Macs
    mas_path: "/usr/local/bin/mas"

  pre_tasks:
    - name: Verify minimum Ansible version
      ansible.builtin.assert:
        that:
          - ansible_version.full is version('2.17', '>=')
        fail_msg: "This playbook requires Ansible 2.17+. Found {{ ansible_version.full }}."

    - name: Resolve profile from hostname
      ansible.builtin.set_fact:
        detected_profile: "{{ hostname_to_profile[ansible_facts.hostname] | default('unknown') }}"

    # This is the single place a profile turns into a module list. dotm sync passes no
    # list; its only extra var is dotm_excluded_modules, this machine's excluded_modules
    # from ~/.config/dotm/config.yml, subtracted last in both branches. The result is the
    # candidate list; the role filter below decides which candidates apply here.
    - name: Compute candidate module list
      ansible.builtin.set_fact:
        candidate_modules: >-
          {{
            (base_modules + (profiles[detected_profile].include | default([])))
            | difference(profiles[detected_profile].exclude | default([]))
            | difference(dotm_excluded_modules | default([]))
            | unique | sort
          }}
      when: detected_profile != 'unknown'

    - name: Use base modules for unknown hostname
      ansible.builtin.set_fact:
        candidate_modules: >-
          {{
            base_modules
            | difference(dotm_excluded_modules | default([]))
            | unique | sort
          }}
      when: detected_profile == 'unknown'

    # Role resolution. The machine declares its role (and any extra capabilities) in its
    # local dotm config; profiles.yml says what each role provides. A candidate applies when
    # every capability under its `requires:` is in the machine's set. A module with no
    # `requires:` key applies everywhere, so a machine with no role declared, whose set is
    # empty, receives exactly the candidates that require nothing.
    - name: Read the role and capabilities this machine declares in its local dotm config
      ansible.builtin.set_fact:
        dotm_local_config: >-
          {{
            lookup('file', ansible_facts.env.HOME ~ '/.config/dotm/config.yml', errors='ignore')
            | default('', true) | from_yaml | default({}, true)
          }}

    - name: Resolve the declared role
      ansible.builtin.set_fact:
        dotm_role: "{{ (dotm_local_config.role | default('', true)) | string }}"

    - name: Refuse a role profiles.yml does not define
      ansible.builtin.assert:
        that:
          - dotm_role == '' or dotm_role in role_capabilities
        fail_msg: >-
          role '{{ dotm_role }}' in ~/.config/dotm/config.yml is not defined under
          role_capabilities in playbooks/profiles.yml (known: {{ role_capabilities.keys() | join(', ') }})

    - name: Resolve the machine's capability set
      ansible.builtin.set_fact:
        dotm_capabilities: >-
          {{
            (((role_capabilities[dotm_role] | default([], true)) if dotm_role != '' else [])
             + (dotm_local_config.capabilities | default([], true)) + (dotm_platform | default(['macos', 'brew', 'gui'])))
            | unique
          }}

    - name: Select the candidates whose requirements the machine's capabilities cover
      ansible.builtin.set_fact:
        final_modules: >-
          {{
            (final_modules | default([]))
            + ([item] if (((lookup('file', playbook_dir ~ '/../modules/' ~ item ~ '/config.yml')
                            | from_yaml | default({}, true)).requires | default([], true))
                          | difference(dotm_capabilities) | length == 0) else [])
          }}
      loop: "{{ candidate_modules }}"

    - name: Order the selected modules
      ansible.builtin.set_fact:
        final_modules: "{{ final_modules | default([]) | unique | sort }}"

    # Homebrew 6+ refuses to load formulae, casks or commands from non-official taps until
    # `brew trust` has recorded them, and HOMEBREW_NO_REQUIRE_TAP_TRUST is deprecated. Trust
    # exactly the taps the selected modules declare, before the role taps them and installs
    # from them. `brew trust` is idempotent: it prints "Already trusted" on repeat and exits 0
    # either way, so this stays deterministic and re-runnable.
    - name: Collect Homebrew taps declared by the selected modules
      ansible.builtin.set_fact:
        declared_homebrew_taps: >-
          {{
            (declared_homebrew_taps | default([]))
            + ((lookup('file', playbook_dir ~ '/../modules/' ~ item ~ '/config.yml')
                | from_yaml | default({}, true)).homebrew_taps | default([]))
          }}
      loop: "{{ final_modules }}"

    - name: Trust the Homebrew taps the selected modules declare
      ansible.builtin.command:
        argv: ["/opt/homebrew/bin/brew", "trust", "--tap", "{{ item }}"]
      loop: "{{ declared_homebrew_taps | default([]) | unique }}"
      register: brew_trust
      changed_when: brew_trust.stdout is search('^Trusted tap')

    - name: Show deployment plan
      ansible.builtin.debug:
        msg: "Role: {{ dotm_role if dotm_role != '' else 'none' }} | Profile: {{ detected_profile }} | Modules ({{ final_modules | length }}): {{ final_modules | join(', ') }}"

  roles:
    - role: ansible-role-dotmodules
      vars:
        dotmodules_repo: "file://{{ playbook_dir }}/../modules"
        dotmodules_dest: "{{ ansible_facts.env.HOME }}/.dotmodules"
        dotmodules_install: "{{ final_modules }}"
        mas_path: "/usr/local/bin/mas"
        # Skip geerlingguy.mac.mas role (uses become:true blocked by eIT).
        # MAS apps are installed in post_tasks without privilege escalation.
        dotmodules_skip_mas_role: true
        # Additional workarounds for geerlingguy.mac collection
        homebrew_install_path: "/opt/homebrew"
        homebrew_user: "{{ ansible_user_id }}"
        homebrew_group: "admin"
        homebrew_check_for_updates: false
        homebrew_upgrade_all_packages: false
        homebrew_clear_cache: false

  # Install MAS apps directly without become to avoid eIT sudo block.
  # The dotmodules role aggregates mas_installed_apps from module configs
  # and promotes it as a host fact, but we skip the geerlingguy.mac.mas
  # role (dotmodules_skip_mas_role: true) and install here instead.
  post_tasks:
    - name: Install Mac App Store apps (without become)
      community.general.mas:
        id: "{{ item }}"
        state: present
      environment:
        PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts.env.PATH }}"
      loop: "{{ mas_installed_apps | default([]) }}"
