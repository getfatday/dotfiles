---
# Hostname-to-profile mapping.
# Intentionally empty in this public file: host names are machine-local and are not
# published. Every host therefore resolves to 'unknown' and receives base_modules minus
# the machine's dotm excluded_modules. deploy.yml is the single place this resolution
# happens; dotm sync passes no module list. The role-to-capability map below is its
# replacement; the hostname map and the profiles at the bottom retire once every module
# that needs a role declares it under `requires:`.
hostname_to_profile: {}

# Role-to-capability map. Each machine declares its role in its local dotm config
# (~/.config/dotm/config.yml, key `role`); deploy.yml reads that file and never a host name,
# so nothing machine-specific lives in this public file. A machine may also list extra
# capabilities directly under `capabilities:` in the same file (a platform, for instance);
# the machine's capability set is the union of what its role provides and what it declares.
# A module that lists capabilities under `requires:` in its config.yml is selected only when
# the machine's capability set covers every one of them. A module with no `requires:` key
# applies on every machine, including one that has not declared a role yet. Adding a role is
# a data change here: name it and list what it provides.
role_capabilities:
  work:
    - work-login
  personal:
    - personal-account
  mixed:
    - work-login
    - personal-account

# Base modules installed on ALL systems
base_modules:
  - 1password
  - alfred
  - bartender
  - bin
  - bun
  - chatgpt
  - chrome
  - claude
  - claude-squad
  - cursor
  - database
  - discord
  - docker
  - dotm
  - dropbox
  - editor
  - figma
  - finance-agent
  - finances
  - firefox
  - flux
  - fonts
  - git
  - go
  - grammarly
  - gws
  - handbrake
  - iterm
  - keepingyouawake
  - keyboard
  - licecap
  - macos
  - media
  - ngrok
  - node
  - obsidian
  - productivity
  - rust
  - security
  - sequel-ace
  - sesh
  - speckit
  - spotify
  - tmux
  - vscode
  - wireguard
  - workmux
  - zsh

# Per-profile overrides
profiles:
  personal:
    include:
      - openclaw
    exclude: []
  work:
    include: []
    exclude:
      - openclaw
