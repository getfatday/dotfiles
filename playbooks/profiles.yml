---
# Hostname-to-profile mapping.
# Intentionally empty in this public file: host names are machine-local and are not
# published. Every host therefore resolves to 'unknown' and receives base_modules, which
# is also what dotm-driven runs apply (dotm passes the module list to Ansible explicitly
# and never reads this map). Profile selection by host capability is the planned
# replacement; the profiles below stay for it.
hostname_to_profile: {}

# Base modules installed on ALL systems
base_modules:
  - 1password
  - alfred
  - bartender
  - bin
  - bun
  - chatgpt
  - chrome
  - claude
  - claude-squad
  - cursor
  - database
  - discord
  - docker
  - dotm
  - dropbox
  - editor
  - figma
  - finances
  - firefox
  - flux
  - fonts
  - git
  - go
  - grammarly
  - gws
  - handbrake
  - iterm
  - keepingyouawake
  - keyboard
  - licecap
  - macos
  - media
  - ngrok
  - node
  - obsidian
  - productivity
  - rust
  - security
  - sequel-ace
  - sesh
  - speckit
  - spotify
  - tmux
  - vscode
  - wireguard
  - workmux
  - zsh

# Per-profile overrides
profiles:
  personal:
    include:
      - openclaw
    exclude: []
  work:
    include: []
    exclude:
      - openclaw
