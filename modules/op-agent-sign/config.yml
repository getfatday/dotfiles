---
# op-agent-sign — unattended SIGNED git commits for agents. The SSH signing key stays in 1Password and is
# fetched with a 1Password SERVICE ACCOUNT by a gpg.ssh.program wrapper into an in-memory ssh-agent (TTL).
# No private key on disk, no Keychain, no dependency on the 1Password desktop app being unlocked.
# Relies on: 1password (op CLI cask), git. Machine-local, never committed:
#   ~/.config/op-agent-sign/config      OP_AGENT_SIGN_KEY_REF (op:// by IDs), optional TTL/DEADLINE/TOKEN_FILE
#   <token file> (default ~/.hermes/.op.env)  OP_SERVICE_ACCOUNT_TOKEN=…  written by `op-agent-sign bootstrap`
# After `dotm sync` run once:  op-agent-sign setup && op-agent-sign bootstrap && op-agent-sign doctor
requires: [macos]
# The module's own dependency, declared so `requires: [macos]` has the package that justifies it (the
# landing contract in test_role.py). The 1password module installs the same cask; brew is idempotent.
homebrew_casks:
  - 1password-cli                 # `op`, used by the signing wrapper and bootstrap
stow_dirs:
  - op-agent-sign
