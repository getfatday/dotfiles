name: dotm verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dotm-verification-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes -r .ci/requirements.lock
      - name: Verify fast
        run: python .ci/verify.py run fast
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-fast
          path: .ci/results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  macos-fixture:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes -r .ci/requirements.lock
      - name: Install pinned role and CI-only collections
        run: |
          ansible-galaxy role install -r .ci/ansible-requirements.yml -p .ci/vendor/roles
          ansible-galaxy collection install -r .ci/ansible-requirements.yml -p .ci/vendor/collections
      - name: Verify macos-fixture
        run: python .ci/verify.py run macos-fixture
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-macos-fixture
          path: .ci/results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  macos-hermes:
    # Own job, own timeout: the Hermes restore clones upstream and runs the official installer's dependency stages,
    # which would not fit the 15-minute fixture budget with room to spare. Credentialless by construction.
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes -r .ci/requirements.lock
      - name: Verify macos-hermes
        run: python .ci/verify.py run macos-hermes
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-macos-hermes
          path: .ci/results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  linux-arm-fixture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes -r .ci/requirements.lock
      - name: Install pinned role and CI-only collections
        run: |
          ansible-galaxy role install -r .ci/ansible-requirements.yml -p .ci/vendor/roles
          ansible-galaxy collection install -r .ci/ansible-requirements.yml -p .ci/vendor/collections
      - name: Verify linux-arm-fixture
        run: python .ci/verify.py run linux-arm-fixture
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-linux-arm-fixture
          path: .ci/results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  acceptance:
    name: dotm-acceptance
    if: always()
    needs: [fast, macos-fixture, macos-hermes, linux-arm-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verification-*
          path: .ci/results/
          merge-multiple: true
      - name: Require all jobs and current receipts
        env:
          VERIFICATION_NEEDS: '{"fast":"${{ needs.fast.result }}","macos-fixture":"${{ needs.macos-fixture.result }}","macos-hermes":"${{ needs.macos-hermes.result }}","linux-arm-fixture":"${{ needs.linux-arm-fixture.result }}"}'
        run: python .ci/verify.py accept
  fleet-receipt:
    # One aggregate document per run for the lab's fleet ledger. It reports the jobs' results; it gates nothing.
    # The lab only reads (gh run list / this artifact); nothing here holds a secret or calls out.
    name: fleet-receipt
    if: always()
    needs: [fast, macos-fixture, macos-hermes, linux-arm-fixture, acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Write fleet-receipt.json
        env:
          FLEET_NEEDS: '{"fast":"${{ needs.fast.result }}","macos-fixture":"${{ needs.macos-fixture.result }}","macos-hermes":"${{ needs.macos-hermes.result }}","linux-arm-fixture":"${{ needs.linux-arm-fixture.result }}","dotm-acceptance":"${{ needs.acceptance.result }}"}'
        run: python3 .ci/fleet_receipt.py fleet-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-receipt
          path: fleet-receipt.json
          retention-days: 30
          if-no-files-found: error
