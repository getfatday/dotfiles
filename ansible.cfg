# Repo-root Ansible config: `ansible-playbook playbooks/bootstrap.yml -l <host>` and `ansible <host> -m ping`
# resolve hosts from the fleet registry. dotm sync passes its own -i (playbooks/inventory) and is unaffected.
[defaults]
inventory = inventory/fleet.yml
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
